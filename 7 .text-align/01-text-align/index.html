<!DOCTYPE html>
<html>

<head>

    <title>CSS Text Align</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>CSS Text Alignment</h1>

    <p class="left">
        This text is aligned to the left.
    </p>

    <p class="center">
        This text is aligned to the center.
    </p>

    <p class="right">
        This text is aligned to the right.
    </p>
    <p class="justify">
        CSS is used to style web pages. The justify value stretches the text so that each line has equal width, creating neat left and right edges.
    </p>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>CSS Vertical Align</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Vertical Align</h1>
    <p>
        Normal Image
        <img src="image.png" alt="Image" class="normal">
    </p>
    <p>
        Top Image
        <img src="image.png" alt="Image" class="top">
    </p>
    <p>
        Middle Image
        <img src="image.png" alt="Image" class="middle">
    </p>
    <p>
        Bottom Image
        <img src="image.png" alt="Image" class="bottom">
    </p>
</body>
</html>

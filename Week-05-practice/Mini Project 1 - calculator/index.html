<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Simple Calculator</title>
</head>
<body>
    <h1>Simple Calculator</h1>
    <label for="num1">Enter First Number:</label>
    <input type="number" id="num1">
    <br><br>
    <label for="num2">Enter Second Number:</label>
    <input type="number" id="num2">
    <br><br>
    <button style="background-color: #9fde0c; color: white;">Add</button>
    <button style="background-color: #02d765; color: white;">Subtract</button>
    <button style="background-color: #0c98de; color: white;">Multiply</button>
    <button style="background-color: #0c0cde; color: white;">Divide</button>
    <br><br>
    <h2>Result: <span id="result">0</span></h2>
    <script src="script.js"></script>
</body>
</html>

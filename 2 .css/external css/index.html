<!--External CSS is the recommended approach because it keeps HTML and styling separate, 
making websites easier to maintain and allowing the same stylesheet to be reused across multiple pages.-->
<!DOCTYPE html>
<html>
<head>
    <title>External CSS Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Hello, World!</h1>
    <p>Welcome to CSS.</p>
</body>
</html>

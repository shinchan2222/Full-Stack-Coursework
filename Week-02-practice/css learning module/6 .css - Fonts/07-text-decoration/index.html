<!DOCTYPE html>
<html>
<head>
    <title>CSS Text Decoration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Text Decoration</h1>
    <p class="underline">
        This is Underline Text.
    </p>
    <p class="overline">
        This is Overline Text.
    </p>
    <p class="line-through">
        This is Line Through Text.
    </p>
    <a href="#" class="none">
        Click Here
    </a>
</body>
</html>

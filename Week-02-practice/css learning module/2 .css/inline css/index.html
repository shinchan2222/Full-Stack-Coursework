<!--Inline CSS is used when you want to style only one specific HTML element. 
It is written directly inside the style attribute of the HTML tag -->

<!--Inline CSS                                 //type
Inside the style attribute of an HTML tag
Styling a single element                      //where we use --> 

<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Example</title>
</head>
<body>

    <h1 style="color: blue; text-align: center;">
        Hello, World!
    </h1>

    <p style="color: gray; font-size: 70px;">
        Welcome to CSS.
    </p>

</body>
</html>

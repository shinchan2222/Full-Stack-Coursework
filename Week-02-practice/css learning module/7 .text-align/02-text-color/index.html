<!DOCTYPE html>
<html>
<head>
    <title>CSS Text Color</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Text Color</h1>
    <p class="red">
        This text is Red.
    </p>
    <p class="green">
        This text is Green.
    </p>
    <p class="blue">
        This text is Blue.
    </p>
    <p class="hex">
        This text uses HEX Color.
    </p>
    <p class="rgb">
        This text uses RGB Color.
    </p>
</body>
</html>

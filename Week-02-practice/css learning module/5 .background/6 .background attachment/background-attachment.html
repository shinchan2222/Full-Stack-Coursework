<!--Controls whether the background scrolls.
| Value    | Description                                |
| -------- | ------------------------------------------ |
| scroll   | Background scrolls with the page (default) |
| fixed    | Background stays fixed                     |
| local    | Background scrolls with the element        |
-->
<!DOCTYPE html>
<html>
<head>
    <title>Background Attachment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Hello World</h1>
    <p>
        Scroll down to see the background attachment effect.
    </p>
    <!-- Extra content to enable scrolling -->
    <div style="height: 1500px;"></div>
</body>
</html>

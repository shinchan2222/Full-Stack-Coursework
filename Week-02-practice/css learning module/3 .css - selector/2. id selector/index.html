<!--Selects one unique element using its id.-->
<!DOCTYPE html>
<html>
<head>
    <title>ID Selector Example</title>
    <link rel="stylesheet" href="style.css">
    <style>
        p{
            font-size:70px;
        }
    </style>
</head>
<body>

    <h1 id="hp">Welcome to CSS</h1>

    <p id="hp">This paragraph is normal.</p>

</body>
</html>
